name: Release

# Ao empurrar uma tag vX.Y.Z: publica no PyPI (Trusted Publishing/OIDC — sem token/segredo
# no repo; configurar o publisher confiável no PyPI antes) E cria a Release no GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # OIDC para o Trusted Publishing do PyPI
      contents: write          # criar a Release no GitHub (softprops/action-gh-release)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (sdist + wheel)
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true    # re-run da mesma tag não quebra se a versão já está no PyPI
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true   # notas automáticas a partir dos commits desde a tag anterior
          files: dist/*                  # anexa sdist + wheel à Release
